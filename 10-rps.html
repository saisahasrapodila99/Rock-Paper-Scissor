<!DOCTYPE html>
<html>
<head>
  <title>Rock Paper Scissors</title>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      background-color:#1E1B4B;
      color:white;
      font-family:Arial, Helvetica, sans-serif;
      display:flex;
      justify-content:center;
      align-items:center;
      min-height:100vh;
      padding:20px;
      font-weight:bold;
    }

    .container{
      width:100%;
      max-width:600px;
      text-align:center;
    }

    .title{
      font-size:35px;
      margin-bottom:50px;
    }

    .move{
      height:150px;
      width:150px;
      border:2px solid black;
      margin:10px;
      border-radius:50%;
      cursor:pointer;
      background-color:white;
      padding:0;
    }

    .move img{
      width:90px;
      height:90px;
      object-fit:contain;
    }

    .result{
      font-size:30px;
      margin-top:30px;
    }

    .moves{
      font-size:20px;
      margin-top:20px;
    }

    .score{
      font-size:20px;
      margin-top:25px;
    }

    .reset{
     margin-top: 50px;
    padding:10px 25px;
    
     
      background:#3B82F6;
            color:white;
            border:none;
            border-radius:25px;
            font-size:26px;
            cursor:pointer;
            transition:0.3s;
            box-shadow:0 8px 20px rgba(0,0,0,0.3);
            
           
    }

    .reset:hover{
      background:#2563EB;
            transform:scale(1.05);
    }


    @media(max-width:600px){

      .title{
        font: size 35px;
        margin-bottom:35px;
      }

      .move{
        height:100px;
        width:100px;
        margin:8px;
      }

      .move img{
        width:60px;
        height:60px;
      }

      .result{
        font-size:25px;
      }

      .moves{
        font-size:16px;
      }

      .score{
        font-size:16px;
      }

      .reset{
        width:120px;
        height:40px;
        font-size:16px;
      }

    }

  </style>

</head>


<body>

<div class="container">

<p class="title">Rock Paper Scissors</p>


<button class="move" onclick="playGame('rock')">
<img src="rock.jpg">
</button>


<button class="move" onclick="playGame('paper')">
<img src="paper.png">
</button>


<button class="move" onclick="playGame('scissors')">
<img src="scissors.png">
</button>


<p class="js-result result"></p>

<p class="js-moves moves"></p>

<p class="js-score score"></p>


<button class="reset" onclick="
score.wins=0;
score.losses=0;
score.ties=0;
localStorage.removeItem('score');
updateScoreElement();
document.querySelector('.js-result').innerHTML='';
document.querySelector('.js-moves').innerHTML='';
">
Reset Score
</button>


</div>



<script>

let result='';
let computerMove='';

let score=JSON.parse(localStorage.getItem('score'));

if(score===null){
  score={
    wins:0,
    losses:0,
    ties:0
  };
}

updateScoreElement();
updateResult();


function playGame(playerMove){

const computerMove=pickComputerMove();


if(playerMove==='scissors'){

 if(computerMove==='rock'){
  result='You Lose';
 }
 else if(computerMove==='paper'){
  result='You Win';
 }
 else{
  result='Tie';
 }

}


else if(playerMove==='paper'){

 if(computerMove==='rock'){
  result='You Win';
 }
 else if(computerMove==='paper'){
  result='Tie';
 }
 else{
  result='You Lose';
 }

}


else if(playerMove==='rock'){

 if(computerMove==='rock'){
  result='Tie';
 }
 else if(computerMove==='paper'){
  result='You Lose';
 }
 else{
  result='You Win';
 }

}



if(result==='You Win'){
 score.wins+=1;
}

else if(result==='You Lose'){
 score.losses+=1;
}

else{
 score.ties+=1;
}


localStorage.setItem('score',JSON.stringify(score));

updateScoreElement();
updateResult();
updateMoves(playerMove,computerMove);

}



function updateScoreElement(){

document.querySelector('.js-score').innerHTML=
`Wins: ${score.wins} , Losses: ${score.losses} , Ties: ${score.ties}`;

}



function updateResult(){

document.querySelector('.js-result').innerHTML=result;

}



function updateMoves(playerMove,computerMove){

document.querySelector('.js-moves').innerHTML=
`You ${playerMove} . Computer ${computerMove}`;

}




function pickComputerMove(){

const randomNumber=Math.random();


if(randomNumber<1/3){

computerMove='rock';

}

else if(randomNumber<2/3){

computerMove='paper';

}

else{

computerMove='scissors';

}


return computerMove;

}

</script>


</body>
</html>
